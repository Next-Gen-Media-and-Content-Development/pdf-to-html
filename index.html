<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chapter 1 — Sample Chapter</title>
<link rel="stylesheet" href="css/styles.css">
<script src="js/chapter.js" defer></script>
</head>
<body>
<header class="chapter-header" role="banner">
  <div class="chapter-header__left">
    <div class="chapter-header__eyebrow">Science · Grade 10</div>
    <h1 class="chapter-header__title">Sample Chapter</h1>
  </div>
  <div class="chapter-header__right">
    <span class="chapter-header__chapter-label">Chapter</span>
    <span class="chapter-header__number">1</span>
  </div>
</header>

<main class="chapter-wrap" id="main-content">
  <h2 class="section-heading">1.1 Sample Section</h2>

  <p>This is selectable chapter text. The actual converter will fill this area from Claude/IDML extracted blocks.</p>

  <figure>
    <img src="img/fig-001.webp" loading="lazy" decoding="async" width="1000" height="1400" alt="Sample figure image">
    <figcaption>Fig. 1.1: Sample figure</figcaption>
  </figure>

  <div class="table-wrap">
    <table class="content-table">
      <caption>Sample Table</caption>
      <thead>
        <tr><th>Column A</th><th>Column B</th></tr>
      </thead>
      <tbody>
        <tr><td>Value A</td><td>Value B</td></tr>
      </tbody>
    </table>
  </div>

  <footer class="book-footer" role="contentinfo">
    <span class="book-footer__label">Book | Grade | Subject</span>
  </footer>
</main>
</body>
</html>
